<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"><animate attributeName="stop-color" values="#0f0c29;#1a1a40;#0f0c29" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#302b63"><animate attributeName="stop-color" values="#302b63;#0e3b5c;#302b63" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#24243e"><animate attributeName="stop-color" values="#24243e;#3a0f4a;#24243e" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="33%" stop-color="#a78bfa"/><stop offset="66%" stop-color="#f472b6"/><stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="txt2" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#f472b6"/><stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .p{fill:#fff}
    .t{font:800 64px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;letter-spacing:1px}
    .s{font:500 22px 'Fira Code',Consolas,'Courier New',monospace;fill:#cbd5e1}
    .hand{transform-origin:860px 120px;transform-box:view-box;animation:wave 2.2s ease-in-out infinite}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
    .in{opacity:0;animation:up 1s ease-out forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.9s}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="6s" repeatCount="indefinite"/>
    </rect>
    <!-- glowing orbs -->
    <circle cx="150" cy="80" r="90" fill="#38bdf8" opacity=".18" filter="url(#glow)">
      <animate attributeName="cy" values="80;130;80" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;220;150" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="240" r="120" fill="#f472b6" opacity=".15" filter="url(#glow)">
      <animate attributeName="cy" values="240;180;240" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1050;980;1050" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="320" r="140" fill="#a78bfa" opacity=".12" filter="url(#glow)">
      <animate attributeName="r" values="140;170;140" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- twinkling stars -->
    <g class="p">
      <circle cx="80" cy="250" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="40" r="1.6"><animate attributeName="opacity" values="1;0;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="270" r="2"><animate attributeName="opacity" values="0;1;0" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="30" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="60" r="2.2"><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="110" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="60" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="290" r="1.8"><animate attributeName="opacity" values="1;0;1" dur="2.6s" begin=".7s" repeatCount="indefinite"/></circle>
    </g>
    <!-- shooting star -->
    <line x1="0" y1="0" x2="80" y2="30" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="100 -40;900 260" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.08;.2;1" dur="6s" repeatCount="indefinite"/>
    </line>
    <!-- text -->
    <g class="in d1"><text x="600" y="145" text-anchor="middle" class="t" fill="url(#txt2)" filter="url(#glow)">Hey, I'm Barath</text></g>
    <text x="880" y="140" font-size="56" class="hand">👋</text>
    <g class="in d2"><text x="600" y="200" text-anchor="middle" class="s">&lt; Full-Stack Developer @ Commutatus /&gt;</text>
    <text x="600" y="236" text-anchor="middle" class="s" style="font-size:17px;fill:#94a3b8">📍 Chennai, India · TypeScript · Ruby · React · Rails</text></g>
    <!-- animated waves -->
    <path fill="#38bdf8" fill-opacity=".15">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 290 C300 250 500 330 800 285 C1000 255 1100 300 1200 280 V320 H0Z;M0 280 C250 320 550 250 800 300 C1000 330 1100 270 1200 295 V320 H0Z;M0 290 C300 250 500 330 800 285 C1000 255 1100 300 1200 280 V320 H0Z"/>
    </path>
    <path fill="#a78bfa" fill-opacity=".2">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 300 C200 280 400 320 600 300 C800 280 1000 320 1200 300 V320 H0Z;M0 305 C200 325 400 285 600 305 C800 325 1000 285 1200 305 V320 H0Z;M0 300 C200 280 400 320 600 300 C800 280 1000 320 1200 300 V320 H0Z"/>
    </path>
  </g>
</svg>
